<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A-173 · 存储卡浏览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"宋体",SimSun,"MS Song","Microsoft YaHei",monospace;
  font-size:12px;background:#008080;overflow:hidden;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;
}

/* 开机过渡 */
#boot{
  position:fixed;inset:0;z-index:10000;background:#000;color:#c8c8c8;
  font-family:"Courier New",monospace;font-size:13px;line-height:1.55;
  padding:26px 30px;white-space:pre;overflow:hidden;
  transition:opacity .6s ease;
}
#boot.hide{opacity:0;pointer-events:none}

/* 桌面 */
#stage{
  position:fixed;inset:0 0 28px 0;display:flex;align-items:center;justify-content:center;
  padding:12px;overflow:auto;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.10), transparent 62%),
    linear-gradient(180deg,#0a8c8c 0%,#006a6a 100%);
}

/* 窗口 */
.window{
  width:820px;max-width:100%;flex:0 0 auto;
  background:#c0c0c0;border:2px solid;
  border-color:#dfdfdf #000 #000 #dfdfdf;
  box-shadow:1px 1px 0 #808080, 5px 5px 16px rgba(0,0,0,.45);
}
.titlebar{
  height:23px;margin:2px 2px 0;
  background:linear-gradient(90deg,#000080 0%,#1084d0 100%);
  display:flex;align-items:center;padding:0 3px 0 5px;
  color:#fff;font-weight:bold;font-size:12px;letter-spacing:.4px;
}
.title-ico{
  width:14px;height:14px;margin-right:5px;background:#c0c0c0;
  border:1px solid #000;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#000;font-weight:bold;flex:0 0 auto;
}
.title-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbtn{
  width:16px;height:14px;margin-left:2px;padding:0;background:#c0c0c0;
  border:1px solid;border-color:#fff #000 #000 #fff;
  font-family:inherit;font-size:9px;line-height:1;color:#000;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.tbtn:active{border-color:#000 #fff #fff #000}

.menubar{display:flex;gap:1px;padding:1px 3px 2px;border-bottom:1px solid #808080}
.menubar span{padding:2px 8px;cursor:default;font-size:12px}
.menubar span:hover{background:#000080;color:#fff}

/* 工具栏 */
.toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:4px 6px;border-bottom:1px solid #808080;
  background:#c0c0c0;
}
.tb-btn{
  height:23px;padding:0 9px;background:#c0c0c0;
  border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
  font-family:inherit;font-size:11.5px;color:#000;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.tb-btn:active{border-color:#000 #dfdfdf #dfdfdf #000;box-shadow:inset 1px 1px 0 #808080}
.tb-btn.on{
  border-color:#000 #dfdfdf #dfdfdf #000;
  box-shadow:inset 1px 1px 0 #808080;
  background:#b0b0b0;font-weight:bold;
}
.tb-sep{width:2px;height:20px;border-left:1px solid #808080;border-right:1px solid #fff}
.addr{
  flex:1;min-width:120px;height:23px;background:#fff;
  border:2px solid;border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;
  display:flex;align-items:center;padding:0 7px;
  font-family:"Courier New",monospace;font-size:11.5px;
  overflow:hidden;white-space:nowrap;
}
.addr b{color:#000080;font-weight:bold}

/* 主体 */
.main{display:flex;height:400px;background:#fff;border:2px solid;
  border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;margin:4px}
.tree{
  flex:0 0 148px;background:#fff;border-right:1px solid #c0c0c0;
  padding:6px 4px;overflow:auto;font-size:11.5px;line-height:1.9;
}
.tree .t-item{padding:1px 4px;white-space:nowrap;cursor:default;border-radius:0}
.tree .t-item:hover{background:#e8e8e8}
.tree .t-item.cur{background:#000080;color:#fff}
.tree .t-item .ico{display:inline-block;width:14px;text-align:center;margin-right:3px}
.tree .indent{padding-left:16px}

.grid-wrap{flex:1;overflow:auto;padding:8px;background:#fff}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:10px 6px;
}
.cell{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;cursor:pointer;border:1px solid transparent;
}
.cell:hover{background:#eef3ff}
.cell.sel{background:#000080;color:#fff;border:1px dotted #fff}
.cell.sel .cell-name{color:#fff}
.cell-thumb{
  width:88px;height:66px;background:#f4f4f4;
  border:1px solid #808080;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.cell-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cell.broken .cell-thumb{background:#e8e8e8;border-style:dashed}
.cell-thumb .ph{
  font-size:9px;color:#a00;font-family:"Courier New",monospace;
  text-align:center;line-height:1.3;padding:0 3px;
}
.cell-name{
  font-size:11px;font-family:"Courier New",monospace;
  color:#000;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:center;
}
.cell-time{font-size:10px;color:#707070;font-family:"Courier New",monospace}
.cell.sel .cell-time{color:#c8d8ff}

/* 状态栏 */
.statusbar{display:flex;gap:2px;padding:0 4px 4px;margin-top:2px}
.status-cell{
  padding:2px 7px;border:1px solid;border-color:#808080 #fff #fff #808080;
  background:#c0c0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11.5px;
}
.status-cell:first-child{flex:1;min-width:0}
.status-cell.fix{flex:0 0 auto;color:#000080}

/* 任务栏 */
.taskbar{
  position:fixed;left:0;right:0;bottom:0;height:28px;z-index:200;
  background:#c0c0c0;border-top:2px solid #dfdfdf;
  display:flex;align-items:center;padding:2px;gap:4px;
}
.start-btn{
  height:22px;padding:0 9px 0 6px;display:flex;align-items:center;gap:5px;
  background:#c0c0c0;border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
  font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;flex:0 0 auto;
}
.start-btn:active{border-color:#000 #dfdfdf #dfdfdf #000;box-shadow:inset 1px 1px 0 #808080}
.start-ico{
  width:13px;height:13px;
  background:linear-gradient(135deg,#ff0000 0 33%,#00a000 33% 66%,#0000e0 66% 100%);
  border:1px solid #000;
}
.task-sep{width:2px;height:20px;border-left:1px solid #808080;border-right:1px solid #fff}
.task-item{
  flex:1;min-width:0;height:22px;display:flex;align-items:center;padding:0 8px;
  background:#c0c0c0;border:2px solid;border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tray{
  flex:0 0 auto;height:22px;display:flex;align-items:center;gap:6px;
  padding:0 9px;border:1px solid;border-color:#808080 #fff #fff #808080;
  font-size:11.5px;font-family:"Courier New",monospace;
}
.tray-dot{width:9px;height:9px;border-radius:50%;background:#00a000;box-shadow:0 0 4px #00c000}

/* 查看器 */
#viewer{
  position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;padding:14px;
}
#viewer.on{display:flex}
.viewer-win{width:760px;max-width:100%}
.viewer-body{display:flex;gap:0;margin:4px;background:#c0c0c0;border:2px solid;
  border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #000}
.viewer-left{flex:1;min-width:0;padding:10px;background:#3a3a3a;
  display:flex;flex-direction:column;gap:8px}
.viewer-img{
  flex:1;min-height:220px;background:#1a1a1a;border:1px solid #000;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.viewer-img img{max-width:100%;max-height:340px;display:block}
.viewer-img .ph{
  color:#888;font-family:"Courier New",monospace;font-size:12px;
  text-align:center;padding:20px;line-height:1.7;
}
.viewer-nav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  color:#ddd;font-family:"Courier New",monospace;font-size:11.5px;
}
.vn-btn{
  height:22px;padding:0 10px;background:#c0c0c0;
  border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;
  box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
  font-family:inherit;font-size:11.5px;cursor:pointer;
}
.vn-btn:active{border-color:#000 #dfdfdf #dfdfdf #000;box-shadow:inset 1px 1px 0 #808080}
.vn-btn:disabled{color:#888;text-shadow:1px 1px 0 #fff;cursor:default}
.viewer-right{
  flex:0 0 268px;background:#c0c0c0;padding:10px 12px;overflow:auto;
  border-left:1px solid #808080;
}
.exif-title{
  font-weight:bold;color:#000080;font-size:12px;
  padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid #808080;
  letter-spacing:1px;
}
.exif-table{width:100%;border-collapse:collapse;font-size:11.5px}
.exif-table td{padding:3px 2px;vertical-align:top;line-height:1.5;word-break:break-all}
.exif-table td.k{color:#000080;width:74px;white-space:nowrap}
.exif-table tr.line td{border-bottom:1px dotted #a8a8a8}
.exif-note{
  margin-top:10px;padding:7px 8px;background:#ffffcc;
  border:1px solid #b8b800;font-size:11.5px;color:#554400;line-height:1.65;
}
.exif-broken{
  margin-top:10px;padding:8px;background:#ffe8e8;
  border:1px solid #c88;font-size:11.5px;color:#900;line-height:1.65;
}

/* 答案区 */
.answer-panel{
  margin:0 4px 4px;padding:9px 11px 11px;
  border:2px solid;border-color:#808080 #fff #fff #808080;background:#c0c0c0;
}
.answer-q{font-size:12px;line-height:1.7;margin-bottom:8px;color:#000}
.answer-q b{color:#a00000}
.answer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer-input{
  flex:1;min-width:160px;height:26px;padding:0 8px;
  font-family:inherit;font-size:12.5px;color:#000;background:#fff;
  border:2px solid;border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;outline:none;border-radius:0;
}
.answer-input:focus{background:#ffffcc}
.answer-msg{margin-top:7px;font-size:11.5px;line-height:1.6;min-height:16px}
.answer-msg.err{color:#a00000}
.answer-msg.ok{color:#006000}

/* CRT */
#crt{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.13) 0px, rgba(0,0,0,.13) 1px,
    transparent 1px, transparent 3px);
  animation:flick 5s infinite;
}
#crt::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.38) 100%);
}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.90}97%{opacity:.98}98%{opacity:.93}}

/* 进度对话框 */
#mask{
  position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.3);
  display:none;align-items:center;justify-content:center;padding:16px;
}
#mask.on{display:flex}
.dialog{
  width:360px;max-width:100%;background:#c0c0c0;
  border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;
  box-shadow:2px 2px 0 #808080, 6px 6px 18px rgba(0,0,0,.5);
}
.dlg-body{padding:16px 18px 18px}
.dlg-msg{font-size:12.5px;margin-bottom:12px;line-height:1.6;
  min-height:20px;font-family:"Courier New",monospace}
.progress{
  height:18px;width:100%;background:#c0c0c0;border:2px solid;
  border-color:#808080 #fff #fff #808080;
  box-shadow:inset 1px 1px 0 #000;padding:2px;
}
.progress .bar{
  height:100%;width:0%;
  background:repeating-linear-gradient(90deg,#000080 0 9px,#c0c0c0 9px 11px);
  transition:width .35s ease;
}

/* 移动端 */
@media (max-width:720px){
  .main{height:auto;min-height:340px;flex-direction:column}
  .tree{flex:0 0 auto;border-right:none;border-bottom:1px solid #c0c0c0;
    max-height:120px;display:flex;gap:2px;flex-wrap:wrap;padding:4px}
  .tree .t-item{padding:2px 6px}
  .tree .indent{padding-left:0}
  .viewer-body{flex-direction:column}
  .viewer-right{flex:0 0 auto;border-left:none;border-top:1px solid #808080}
  .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .cell-thumb{width:76px;height:58px}
}
@media (max-width:460px){
  .tb-btn{padding:0 6px;font-size:11px}
  .addr{min-width:80px;font-size:11px}
}
</style>
</head>

<div id="boot"></div>

<!-- 主窗口 -->
<div id="stage">

    <!-- 主体 -->
    <div class="main">
      <div class="tree">
        <div class="t-item"><span class="ico">▸</span>本地磁盘 (C:)</div>
        <div class="t-item"><span class="ico">▸</span>本地磁盘 (D:)</div>
        <div class="t-item"><span class="ico">▾</span>可移动磁盘 (E:)</div>

      <div class="grid-wrap">

      </div>
    </div>

    <!-- 状态栏 -->
    <div class="statusbar">

      <div class="status-cell fix" id="selInfo">未选择</div>
      <div class="status-cell fix">可用空间 1.24 GB</div>
    </div>

    <!-- 答案 -->
    <div class="answer-panel">
      <div class="answer-q">
        <b>归档核查：</b>请根据存储卡内容判断 —— 这 6 张地点照片中，
        <b>第 6 张</b> 的拍摄地点在哪里？<br>
        <span style="color:#555">（输入地点名称，如"XX书店"）</span>
      </div>
      <div class="answer-row">
        <input class="answer-input" id="answerInput" type="text"
               placeholder="请输入地点名称 ..." autocomplete="off" spellcheck="false">
        <button class="tb-btn" id="btnSubmit" style="height:26px">提交核查</button>
      </div>
      <div class="answer-msg" id="answerMsg"></div>
    </div>

  </div>
</div>

<!-- 查看器 -->
<div id="viewer">
  <div class="window viewer-win">
    <div class="titlebar">
      <div class="title-ico">图</div>
      <div class="title-text" id="vTitle">IMG_0000.JPG</div>
      <button class="tbtn" id="vClose" title="关闭">×</button>
    </div>
    <div class="viewer-body">
      <div class="viewer-left">
        <div class="viewer-img" id="vImg"></div>
        <div class="viewer-nav">
          <button class="vn-btn" id="vPrev">◀ 上一张</button>
          <span id="vIndex">1 / 8</span>
          <button class="vn-btn" id="vNext">下一张 ▶</button>
        </div>
      </div>
      <div class="viewer-right">
        <div class="exif-title">EXIF 信息</div>
        <table class="exif-table" id="vExif"></table>
        <div id="vExtra"></div>
      </div>
    </div>
  </div>
</div>

<!-- 进度 -->
<div id="mask">
  <div class="dialog">
    <div class="titlebar">
      <div class="title-ico">▶</div>
      <div class="title-text">正在校验 ...</div>
    </div>
    <div class="dlg-body">
      <div class="dlg-msg" id="dlgMsg">正在读取 ...</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
  </div>
</div>

<div id="crt"></div>

    broken: false
  },
  {
    file: 'IMG_0302.JPG',
    size: '2.49 MB',
    src: 'photos/p7.jpg',
    time: '2018-06-11 18:23:57',
    place: '旧城区 · 百货大楼',
    camera: 'Canon PowerShot A640',
    iso: 'ISO 100',
    fnum: 'f/4.5',
    expo: '1/320 s',
    focus: '7.3 mm',
    gps: 'N 30°14\'50"  E 120°09\'18"',
    note: '天台边缘，远处有个锈掉的铁风向标。',
    broken: false
  },
  {
    file: 'IMG_0289.JPG',
    size: '—',
    src: '',
    time: '2018-06-11 20:07:14',
    place: '（无法读取）',
    camera: '（无法读取）',
    iso: '—',
    fnum: '—',
    expo: '—',
    focus: '—',
    gps: '（无法读取）',
    note: '文件损坏。仅能读取到拍摄时间。',
    broken: true
  }
];

/* 正确答案（包含任一即可） */
var ANSWERS = ['拾光书局', '旧城书店', '书店'];

/* ============================================================
   开机过渡
   ============================================================ */
(function boot(){
  var lines = [
    '>> 已挂载可移动磁盘 E:',
    '>> 正在读取 DCIM\\100MEDIA ...',
    '>> 发现 8 个图像文件',
    '',
    '>> 正在解析 EXIF 信息 ...',
    '>> 完成。',
    '',
    '提示：可切换工具栏中的排序方式。',
    ''
  ];
  var el = document.getElementById('boot');
  var i = 0;
  function next(){
    if(i < lines.length){
      el.textContent += lines[i] + '\n';
      i++;
      var d = lines[i-1] === '' ? 35 : (75 + Math.random()*80);
      setTimeout(next, d);
    } else {
      setTimeout(function(){
        el.classList.add('hide');
        setTimeout(function(){ el.style.display='none'; }, 700);
      }, 420);
    }
  }
  next();
})();

/* ============================================================
   状态
   ============================================================ */
var sortMode = 'name';
var selectedId = null;
var viewIndex = -1;      // 查看器中当前照片在排序列表中的位置
var currentList = [];    // 当前排序后的列表
var solved = false;

var grid      = document.getElementById('grid');
var statusText= document.getElementById('statusText');
var selInfo   = document.getElementById('selInfo');

/* ============================================================
   排序 + 渲染
   ============================================================ */
function sortList(mode){
  var list = PHOTOS.slice();
  if(mode === 'name'){
    list.sort(function(a,b){ return a.file.localeCompare(b.file); });
  }else{
    list.sort(function(a,b){ return a.time.localeCompare(b.time); });
  }
  return list;
}

function render(){
  currentList = sortList(sortMode);
  grid.innerHTML = '';

  currentList.forEach(function(p, idx){
    var cell = document.createElement('div');
    cell.className = 'cell';
    if(p.broken) cell.classList.add('broken');
    if(selectedId === p.file) cell.classList.add('sel');

    var thumb = document.createElement('div');
    thumb.className = 'cell-thumb';

    if(p.broken || !p.src){
      var ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = '文件损坏<br>无法预览';
      thumb.appendChild(ph);
    }else{
      var img = document.createElement('img');
      img.src = p.src;
      img.alt = p.file;
      img.onerror = function(){
        img.remove();
        var ph = document.createElement('div');
        ph.className = 'ph';
        ph.innerHTML = '图片未找到<br>' + p.file;
        thumb.appendChild(ph);
        cell.classList.add('broken');
      };
      thumb.appendChild(img);
    }

    var name = document.createElement('div');
    name.className = 'cell-name';
    name.textContent = p.file;

    var time = document.createElement('div');
    time.className = 'cell-time';
    time.textContent = p.time.slice(0,10);

    cell.appendChild(thumb);
    cell.appendChild(name);
    cell.appendChild(time);

    cell.addEventListener('click', function(){
      selectedId = p.file;
      viewIndex = idx;
      render();
      updateSelInfo(p);
      openViewer(idx);
    });

    grid.appendChild(cell);
  });

  // 状态栏
  statusText.textContent = '就绪。共 ' + currentList.length + ' 个对象。'
    + (sortMode === 'time' ? '（已按拍摄时间排序）' : '（已按文件名排序）');
}

function updateSelInfo(p){
  if(!p){ selInfo.textContent = '未选择'; return; }
  selInfo.textContent = '已选：' + p.file;
}

/* ============================================================
   排序按钮
   ============================================================ */
var btnName = document.getElementById('sortName');
var btnTime = document.getElementById('sortTime');

btnName.addEventListener('click', function(){
  if(sortMode === 'name') return;
  sortMode = 'name';
  btnName.classList.add('on');
  btnTime.classList.remove('on');
  render();
});

btnTime.addEventListener('click', function(){
  if(sortMode === 'time') return;
  sortMode = 'time';
  btnTime.classList.add('on');
  btnName.classList.remove('on');
  render();
});

/* ============================================================
   查看器
   ============================================================ */
var viewer   = document.getElementById('viewer');
var vTitle   = document.getElementById('vTitle');
var vImg     = document.getElementById('vImg');
var vExif    = document.getElementById('vExif');
var vExtra   = document.getElementById('vExtra');
var vIndexEl = document.getElementById('vIndex');
var vPrev    = document.getElementById('vPrev');
var vNext    = document.getElementById('vNext');

function openViewer(idx){
  if(idx < 0 || idx >= currentList.length) return;
  viewIndex = idx;
  var p = currentList[idx];

  vTitle.textContent = p.file;
  vIndexEl.textContent = (idx+1) + ' / ' + currentList.length;

  // 图片
  vImg.innerHTML = '';
  if(p.broken || !p.src){
    var ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML = '⚠ 文件损坏<br>无法显示图像<br><br>文件名：' + p.file;
    vImg.appendChild(ph);
  }else{
    var img = document.createElement('img');
    img.src = p.src;
    img.alt = p.file;
    img.onerror = function(){
      vImg.innerHTML = '<div class="ph">⚠ 图片未找到<br>' + p.file + '</div>';
    };
    vImg.appendChild(img);
  }

  // EXIF
  var rows = [
    ['文件名', p.file],
    ['文件大小', p.size],
    ['拍摄时间', p.time],
    ['拍摄地点', p.place],
    ['相机型号', p.camera],
    ['光圈', p.fnum],
    ['快门', p.expo],
    ['ISO', p.iso],
    ['焦距', p.focus],
    ['GPS', p.gps]
  ];
  vExif.innerHTML = rows.map(function(r){
    return '<tr class="line"><td class="k">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');

  // 备注 / 损坏提示
  if(p.broken){
    vExtra.innerHTML = '<div class="exif-broken">⚠ ' + p.note + '</div>';
  }else{
    vExtra.innerHTML = '<div class="exif-note">备注：' + p.note + '</div>';
  }

  vPrev.disabled = (idx <= 0);
  vNext.disabled = (idx >= currentList.length - 1);

  viewer.classList.add('on');
}

function closeViewer(){
  viewer.classList.remove('on');
}

vPrev.addEventListener('click', function(){
  if(viewIndex > 0){
    var p = currentList[viewIndex - 1];
    selectedId = p.file;
    updateSelInfo(p);
    render();
    openViewer(viewIndex - 1);
  }
});
vNext.addEventListener('click', function(){
  if(viewIndex < currentList.length - 1){
    var p = currentList[viewIndex + 1];
    selectedId = p.file;
    updateSelInfo(p);
    render();
    openViewer(viewIndex + 1);
  }
});
document.getElementById('vClose').addEventListener('click', closeViewer);
viewer.addEventListener('click', function(e){
  if(e.target === viewer) closeViewer();
});

/* 键盘左右切换 */
document.addEventListener('keydown', function(e){
  if(!viewer.classList.contains('on')) return;
  if(e.key === 'ArrowLeft')  vPrev.click();
  if(e.key === 'ArrowRight') vNext.click();
  if(e.key === 'Escape')     closeViewer();
});

/* ============================================================
   提交答案
   ============================================================ */
var answerInput = document.getElementById('answerInput');
var answerMsg   = document.getElementById('answerMsg');
var btnSubmit   = document.getElementById('btnSubmit');

btnSubmit.addEventListener('click', submitAnswer);
answerInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter') submitAnswer();
});

function submitAnswer(){
  if(solved) return;
  var v = (answerInput.value || '').trim();
  if(!v){
    answerMsg.className = 'answer-msg err';
    answerMsg.textContent = '请输入地点名称。';
    return;
  }

  var ok = ANSWERS.some(function(a){ return v.indexOf(a) >= 0; });

  if(ok){
    solved = true;
    btnSubmit.disabled = true;
    answerInput.disabled = true;
    answerMsg.className = 'answer-msg ok';
    answerMsg.textContent = '核查通过。正在载入聊天记录备份 ...';
    runProgress();
  }else{
    answerMsg.className = 'answer-msg err';
    answerMsg.textContent = '地点不匹配。请重新查看第 6 张照片的 EXIF 信息。';
  }
}

/* ============================================================
   进度跳转
   ============================================================ */
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

async function runProgress(){
  var mask = document.getElementById('mask');
  var bar  = document.getElementById('bar');
  var msg  = document.getElementById('dlgMsg');

  mask.classList.add('on');
  bar.style.width = '0%';

  var steps = [
    ['正在核对地点 ...',       28, 600],
    ['正在关联档案 A-173 ...', 56, 640],
    ['正在读取聊天记录 ...',   84, 700],
    ['载入完成。',            100, 520]
  ];

  for(var i = 0; i < steps.length; i++){
    msg.textContent = steps[i][0];
    bar.style.width = steps[i][1] + '%';
    await wait(steps[i][2]);
  }

  msg.textContent = '正在跳转 ...';
  await wait(400);
  window.location.href = NEXT_PAGE;
}

/* ============================================================
   启动
   ============================================================ */
render();
</script>
